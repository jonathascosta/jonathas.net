<title>Cover · Sudoku generator</title>

<style>
  svg.grid { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; overflow: visible; }
  .cell { fill: rgb(7 25 48 / 0.55); stroke: rgb(232 240 255 / 0.3); stroke-width: 1; }
  .in-row, .in-col, .in-box { fill: rgb(232 240 255 / 0.1); }
  .target { fill: rgb(255 138 91 / 0.2); stroke: var(--accent); stroke-width: 2.5; }
  .thick { stroke: rgb(232 240 255 / 0.85); stroke-width: 2; }
  .digit { font-family: var(--mono); font-size: 22px; font-weight: 600; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .q { font-family: var(--mono); font-size: 24px; font-weight: 700; fill: var(--accent); text-anchor: middle; dominant-baseline: central; }

  .masks { position: absolute; left: 610px; top: 150px; display: grid; gap: 10px; }
  .mask { display: flex; align-items: center; gap: 6px; font-size: 18px; }
  .mask-name { width: 128px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .bit { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid var(--ink-faint); background: var(--panel); color: var(--ink-faint); }
  .bit.on { color: var(--ink); background: rgb(232 240 255 / 0.14); border-color: rgb(232 240 255 / 0.6); font-weight: 600; }
  .bit.head { border: 0; background: none; color: var(--ink-soft); font-size: 13px; height: 22px; }
  .bit.cand { color: var(--accent); background: rgb(255 138 91 / 0.18); border-color: var(--accent); font-weight: 700; }
  .union { margin-top: 6px; padding-top: 14px; border-top: 1px dashed var(--ink-faint); }
  .formula { position: absolute; left: 610px; top: 530px; font-size: 16px; line-height: 1.8; color: var(--ink-soft); }
  .formula b { color: var(--accent); font-weight: 600; }
</style>
</head>
