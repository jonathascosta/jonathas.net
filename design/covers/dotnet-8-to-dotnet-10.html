<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover · .NET 8 to .NET 10</title>
<link rel="stylesheet" href="base.css">
<style>
  .diff {
    position: absolute;
    left: 90px;
    top: 84px;
    width: 560px;
    border: 1px solid var(--ink-faint);
    background: var(--panel);
    font-size: 17px;
    line-height: 1.9;
  }
  .diff .tab {
    padding: 8px 16px;
    border-bottom: 1px solid var(--ink-faint);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .diff pre { padding: 12px 16px 14px; font: inherit; }
  .del { color: var(--ink-faint); text-decoration: line-through; text-decoration-thickness: 1px; }
  .add { color: var(--accent); }
  .sign { display: inline-block; width: 22px; }

  svg.timeline { position: absolute; left: 0; top: 250px; width: 1200px; height: 390px; overflow: visible; }
  svg text { font-family: var(--mono); fill: var(--ink); }
  .axis { stroke: var(--ink-faint); stroke-width: 1; }
  .tick text { font-size: 13px; fill: var(--ink-soft); text-anchor: middle; }
  .row-label { font-size: 17px; font-weight: 600; }
  .row-kind { font-size: 12px; letter-spacing: 0.12em; fill: var(--ink-soft); }
  .bar { fill: rgb(232 240 255 / 0.14); stroke: rgb(232 240 255 / 0.85); stroke-width: 1.5; }
  .bar.next { fill: rgb(255 138 91 / 0.16); stroke: var(--accent); stroke-width: 2; }
  .bar-text { font-size: 13px; fill: var(--ink-soft); dominant-baseline: central; }
  .bar-text.next { fill: var(--accent); }
  .eol { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 6; }
  .eol-label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--accent); }
</style>
</head>
<body>
  <div class="diff">
    <div class="tab">Directory.Build.props</div>
<pre><span class="del"><span class="sign">-</span>&lt;TargetFramework&gt;net8.0&lt;/TargetFramework&gt;</span>
<span class="add"><span class="sign">+</span>&lt;TargetFramework&gt;net10.0&lt;/TargetFramework&gt;</span></pre>
  </div>

  <!-- x = 150 + months since Jul 2023 × 14.545 (Jul 2023 → Jan 2029 over 960 px) -->
  <svg class="timeline" viewBox="0 0 1200 390">
    <line class="axis" x1="150" y1="330" x2="1110" y2="330" />
    <g class="tick">
      <line class="axis" x1="237" y1="326" x2="237" y2="334" /><text x="237" y="356">2024</text>
      <line class="axis" x1="412" y1="326" x2="412" y2="334" /><text x="412" y="356">2025</text>
      <line class="axis" x1="586" y1="326" x2="586" y2="334" /><text x="586" y="356">2026</text>
      <line class="axis" x1="761" y1="326" x2="761" y2="334" /><text x="761" y="356">2027</text>
      <line class="axis" x1="935" y1="326" x2="935" y2="334" /><text x="935" y="356">2028</text>
    </g>

    <!-- .NET 8: Nov 2023 → 10 Nov 2026 -->
    <text class="row-label" x="90" y="92" text-anchor="end">.NET 8</text>
    <text class="row-kind" x="90" y="112" text-anchor="end">LTS</text>
    <rect class="bar" x="215" y="76" width="521" height="40" rx="4" />
    <text class="bar-text" x="231" y="96">Nov 2023 → Nov 2026</text>

    <!-- .NET 9: Nov 2024 → 10 Nov 2026 -->
    <text class="row-label" x="90" y="172" text-anchor="end">.NET 9</text>
    <text class="row-kind" x="90" y="192" text-anchor="end">STS</text>
    <rect class="bar" x="388" y="156" width="348" height="40" rx="4" />
    <text class="bar-text" x="404" y="176">Nov 2024 → Nov 2026</text>

    <!-- .NET 10: Nov 2025 → Nov 2028 -->
    <text class="row-label" x="90" y="252" text-anchor="end" fill="#ff8a5b">.NET 10</text>
    <text class="row-kind" x="90" y="272" text-anchor="end">LTS</text>
    <rect class="bar next" x="562" y="236" width="523" height="40" rx="4" />
    <text class="bar-text next" x="578" y="256">Nov 2025 → Nov 2028</text>

    <line class="eol" x1="736" y1="30" x2="736" y2="330" />
    <text class="eol-label" x="750" y="46">END OF SUPPORT · 10 NOV 2026</text>
  </svg>

  <div class="sheet"><span><b>jonathas.net</b></span><span>fig. 05</span><span>.NET support timeline</span></div>
</body>
</html>
