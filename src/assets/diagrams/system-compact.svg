<!-- Blueprint diagram of the systems on jonathas.net. Styled by src/components/SystemDiagram.astro and design/covers/base.css. -->
<svg class="arch arch-compact" viewBox="0 0 360 404" role="img" aria-label="Diagram: on Azure, clients call an API gateway and a .NET API backed by SQL Server, Cosmos DB and Blob Storage, with AI agents and Service Bus queues.">
  <defs>
    <path id="jm-sql" d="M180 36V240H72V280"/>
    <path id="jm-blob" d="M180 36V240H288V280"/>
    <path id="jm-ai" d="M180 188H18V352H102"/>
    <path id="jm-queue" d="M180 188H342V352H258"/>
  </defs>
  <g class="zones">
    <rect x="6" y="72" width="348" height="324" rx="14"/>
    <text x="20" y="94">AZURE</text>
  </g>
  <g class="edges">
    <path d="M180 60V88"/>
    <path d="M180 136V160"/>
    <path d="M180 216V240M72 240H288M72 240V256M180 240V256M288 240V256"/>
    <path d="M100 188H18V352H28"/>
    <path d="M260 188H342V352H332"/>
  </g>
  <g class="packets">
    <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#jm-sql"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath href="#jm-blob"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.6s" begin="0.7s" repeatCount="indefinite"><mpath href="#jm-ai"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.6s" begin="2s" repeatCount="indefinite"><mpath href="#jm-queue"/></animateMotion></circle>
  </g>
  <g class="nodes">
    <g><rect x="120" y="12" width="120" height="48" rx="8"/><text x="180" y="34">Clients</text><text class="sub" x="180" y="51">web · mobile</text></g>
    <g><rect x="120" y="88" width="120" height="48" rx="8"/><text x="180" y="110">Gateway</text><text class="sub" x="180" y="127">https</text></g>
    <g class="primary"><rect x="100" y="160" width="160" height="56" rx="8"/><text x="180" y="185">.NET API</text><text class="sub" x="180" y="204">asp.net core</text></g>
    <g><rect x="28" y="256" width="88" height="52" rx="8"/><text x="72" y="279">SQL</text><text class="sub" x="72" y="297">server</text></g>
    <g><rect x="136" y="256" width="88" height="52" rx="8"/><text x="180" y="279">Cosmos</text><text class="sub" x="180" y="297">db</text></g>
    <g><rect x="244" y="256" width="88" height="52" rx="8"/><text x="288" y="279">Blob</text><text class="sub" x="288" y="297">storage</text></g>
    <g><rect x="28" y="328" width="148" height="48" rx="8"/><text x="102" y="350">AI agents</text><text class="sub" x="102" y="367">llm · tools</text></g>
    <g><rect x="184" y="328" width="148" height="48" rx="8"/><text x="258" y="350">Service Bus</text><text class="sub" x="258" y="367">queues</text></g>
  </g>
</svg>
